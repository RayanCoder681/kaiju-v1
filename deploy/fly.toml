# Fly.io — configuration Kaiju. Remplacer <APP_NAME> et <REGION> (ex. cdg = Paris).
# Déploiement : fly launch --no-deploy  (génère l'app) puis créer un volume et déployer :
#   fly volumes create kaiju_data --size 1 --region <REGION>
#   fly secrets set SESSION_SECRET=... PUBLIC_URL=https://<APP_NAME>.fly.dev
#   fly deploy
app = "<APP_NAME>"
primary_region = "<REGION>"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"
  DATABASE_PATH = "/data/kaiju.sqlite"
  BACKUP_DIR = "/data/backups"
  UPLOAD_DIR = "/data/uploads"

# Volume persistant pour SQLite + médias + sauvegardes.
[[mounts]]
  source = "kaiju_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false   # garder la machine active (connexions Socket.IO longues)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/api/health"
      interval = "15s"
      timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
